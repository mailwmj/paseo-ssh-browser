<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · SSH Browser · Web services</title>
<!--
  PROTOTYPE — throwaway, not part of the plugin. Open this file directly in a browser.
  Question: what should the SSH Browser "Web services" screen look like?
  The current screen (0) plus two fixed-size card designs (J/K) for a single SSH host,
  switchable via ?variant= and the bottom bar (← / → keys).
  Style: true-black-flat (design-taste-frontend app sheet, seed 1258054094) on Paseo's own dark tokens:
  cards are one lightness step above the ground, no borders or shadows, colour only on data (the forward).
  Signature element: the SSH tunnel from mir-A5:port to localhost:port on every card.
  Mock data only, all state in memory. Favicons are drawn stand-ins for the services' real favicons.
-->
<style>
  :root {
    /* Paseo dark theme, mapped onto the style's roles */
    --ground: #161618; --surface: #1e1e21; --raised: #28282c; --control: #3a3a41;
    --text: #f2f2f3; --muted: #b4b4b4; --faint: #949494;
    --positive: #4ade80; --accent: #9d8cf5;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --card-w: 304px; --card-h: 112px; --gap: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .page { max-width: 1320px; margin: 0 auto; padding: 24px 24px 140px; display: flex; flex-direction: column; gap: 32px; }
  h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; }
  h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  h2 .n { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.sm { width: 14px; height: 14px; }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader { width: 14px; height: 14px; border: 2px solid var(--control); border-top-color: var(--muted); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .ib:hover { background: var(--raised); color: var(--text); }
  .ib:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 0: current ---------- */
  .v0-btn-lg { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid #2c2c31; border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 13px; }
  .v0-host { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .v0-hicon, .v0-av { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--muted); flex: none; }
  .v0-av { background: var(--raised); color: var(--accent); font-weight: 700; font-size: 14px; }
  .v0-hname { flex: 1; font-size: 15px; font-weight: 600; }
  .v0-hact { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); padding: 0 8px; height: 40px; font-size: 13px; }
  .v0-table { border: 1px solid #2c2c31; border-radius: 12px; background: var(--surface); overflow: hidden; }
  .v0-grid { display: grid; grid-template-columns: minmax(0, 2.3fr) 75px 110px minmax(0, 1fr) 100px 184px; gap: 10px; align-items: center; padding: 0 14px; }
  .v0-head { padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid #2c2c31; color: var(--muted); font-size: 12px; }
  .v0-row { min-height: 60px; cursor: pointer; font-size: 12px; }
  .v0-row + .v0-row { border-top: 1px solid #2c2c31; }
  .v0-svc { display: flex; align-items: center; gap: 12px; }
  .v0-svc b { flex: 1; font-size: 14px; }
  .v0-st { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .v0-st.on { color: var(--positive); } .v0-st i { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); } .v0-st.on i { background: var(--positive); }
  .v0-acts { display: flex; justify-content: flex-end; gap: 12px; color: var(--muted); }
  .v0-acts button { display: inline-flex; align-items: center; gap: 5px; height: 40px; }

  /* ---------- shared by J and K ---------- */
  .title-row { display: flex; align-items: center; gap: 12px; }
  .scope { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--surface); color: var(--muted); font-size: 13px; }
  .title-row .tools { margin-left: auto; display: flex; gap: 4px; }
  .host-h { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 15px; font-weight: 600; }
  .host-h svg { color: var(--muted); }
  .host-block { display: flex; flex-direction: column; gap: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, var(--card-w)); gap: var(--gap); }

  .card { position: relative; width: var(--card-w); height: var(--card-h); padding: 16px; border-radius: 12px; background: var(--surface);
    display: flex; flex-direction: column; cursor: pointer; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .12s, background .12s; }
  .card:hover { box-shadow: inset 0 0 0 1px var(--control); }
  .card:active { background: var(--raised); }
  .head { display: flex; align-items: flex-start; gap: 12px; padding-right: 60px; }
  .fav { width: 20px; height: 20px; flex: none; margin-top: 0; border-radius: 5px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .fav.none { color: var(--faint); }
  .names { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 12px; line-height: 16px; color: var(--muted); }
  .sub.cmd { font: 12px/16px var(--mono); color: var(--faint); }
  .card.other .title { font-weight: 500; color: #dcdcdf; }
  .acts { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; }
  .acts .ib { width: 28px; height: 28px; opacity: 0; transition: opacity .12s; }
  .card:hover .acts .ib, .card:focus-within .acts .ib { opacity: 1; }
  .acts .ib:focus-visible { opacity: 1; }

  /* the tunnel: remote end, link, local end */
  .tunnel { margin-top: auto; display: grid; grid-template-columns: auto minmax(24px, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .end { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .end.local { color: var(--text); text-align: right; }
  .link { position: relative; height: 2px; border-radius: 1px; background: var(--raised); }
  .link::before, .link::after { content: ""; position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 4px; background: var(--ground); box-shadow: inset 0 0 0 1.5px var(--control); }
  .link::before { left: -4px; } .link::after { right: -4px; }
  .link .fill { position: absolute; inset: 0; border-radius: 1px; background: var(--positive); transform-origin: left; transform: scaleX(0); }
  .on .link .fill { transform: scaleX(1); }
  .on .link::before, .on .link::after { background: var(--positive); box-shadow: none; }
  .busy .link .fill { animation: dig .7s ease-out forwards; }
  @keyframes dig { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* K: the two ports as the card's figures */
  .card.k { --card-h: 140px; }
  .ports { margin-top: auto; display: grid; grid-template-columns: auto minmax(24px, 1fr) auto; align-items: end; gap: 12px; font-variant-numeric: tabular-nums; }
  .ports .num { font-size: 22px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
  .ports .num.off { color: var(--faint); font-weight: 400; }
  .ports .num.local { text-align: right; }
  .ports .num.local.on { color: var(--positive); }
  .ports .cap { display: block; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--faint); letter-spacing: 0; }
  .ports .link { margin-bottom: 20px; }

  /* One column fits anyway: let the card take the width so both margins match. */
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } .card { width: auto; } }
  @media (prefers-reduced-motion: reduce) { .busy .link .fill { animation: none; transform: scaleX(1); } .card { transition: none; } }

  /* ---------- prototype switcher (not part of the design) ---------- */
  .sw { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 999px; background: #fef08a; color: #111; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.5); white-space: nowrap; z-index: 10; max-width: calc(100vw - 24px); }
  .sw button { width: 26px; height: 26px; border-radius: 13px; font-size: 16px; font-weight: 700; }
  .sw button:hover { background: rgba(0,0,0,.1); }
  .sw .name { font-weight: 700; min-width: 130px; text-align: center; }
  .sw .sep { width: 1px; height: 16px; background: rgba(0,0,0,.2); }
  .sw label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .sw .state { min-width: 0; max-width: 420px; overflow: hidden; text-overflow: ellipsis; color: #444; padding-right: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  unplug: '<path d="m19 5 3-3"/><path d="m2 22 3-3"/><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/>',
  server: '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const ic = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Drawn stand-ins for each service's own favicon, which the real screen would load from the page.
const FAVICONS = {
  vite: '<svg viewBox="0 0 20 20" width="20" height="20"><rect width="20" height="20" rx="5" fill="#2a2140"/><path d="M3.5 5 10 17l6.5-12-6.5 1.4z" fill="#8f86ff"/><path d="M11 3.2 7.6 10h2.3l-.8 4.6 3.6-6.4h-2.2l1-5z" fill="#ffd62e"/></svg>',
  storybook: '<svg viewBox="0 0 20 20" width="20" height="20"><rect width="20" height="20" rx="5" fill="#ff4785"/><path d="M13 6.3c-.6-.6-1.6-1-2.9-1-1.8 0-3 .9-3 2.3 0 3 5 2 5 3.9 0 .7-.7 1.2-1.8 1.2-1.1 0-2-.4-2.6-1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  opencode: '<svg viewBox="0 0 20 20" width="20" height="20"><rect width="20" height="20" rx="5" fill="#f4f4f5"/><rect x="5" y="5" width="10" height="10" fill="none" stroke="#18181b" stroke-width="2"/><rect x="8" y="8" width="4" height="4" fill="#18181b"/></svg>',
  cups: '<svg viewBox="0 0 20 20" width="20" height="20"><rect width="20" height="20" rx="5" fill="#1f5fae"/><path d="M6 8V4.5h8V8M6 13H4.5V8h11v5H14M6.5 11.5h7v4h-7z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  hermes: '<svg viewBox="0 0 20 20" width="20" height="20"><rect width="20" height="20" rx="5" fill="#0f2f2a"/><path d="M6 5v10M14 5v10M6 10h8" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/></svg>',
  next: '<svg viewBox="0 0 20 20" width="20" height="20"><circle cx="10" cy="10" r="10" fill="#fff"/><path d="M7 14V6l7 9" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 6v5" stroke="#000" stroke-width="1.8"/></svg>',
};

const VARIANTS = [
  { key: "0", name: "当前版本" },
  { key: "J", name: "隧道卡片" },
  { key: "K", name: "端口数字卡片" },
];

// Mock data: mir-A5 mirrors the screenshot, plus a forwarded vite page and a second page in my-project.
const HOSTS = [
  { id: "mir", name: "mir-A5", services: [
    { port: 5173, title: "web", fav: "vite", cmd: "vite --port 5173", ws: { project: "paseo-broswer", name: "main" }, local: 5173 },
    { port: 6006, title: "storybook", fav: "storybook", cmd: "storybook dev -p 6006", ws: { project: "my-project", name: "preview-tunnel" }, local: null },
    { port: 49374, title: "OpenCode", fav: "opencode", cmd: "opencode serve", ws: { project: "my-project", name: "preview-tunnel" }, local: null },
    { port: 10631, title: "Home - CUPS 2.4.16", fav: "cups", cmd: "cupsd -l", ws: null, local: 10631 },
    { port: 56469, title: "Hermes Agent - Dashboard", fav: "hermes", cmd: "hermes dashboard", ws: null, local: null },
    { port: 59227, title: null, fav: null, cmd: "python3 -m http.server 59227", ws: null, local: 60000 },
  ] },
  { id: "dev", name: "bkk-dev", services: [
    { port: 3000, title: "next dev", fav: "next", cmd: "next dev", ws: { project: "shop-web", name: "shop-web" }, local: null },
    { port: 6006, title: "storybook", fav: "storybook", cmd: "storybook dev -p 6006", ws: { project: "shop-web", name: "shop-web" }, local: null },
    { port: 8080, title: null, fav: null, cmd: "java -jar app.jar", ws: null, local: null },
  ] },
];

const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS.some((v) => v.key === params.get("variant")) ? params.get("variant") : "J",
  twoHosts: params.get("hosts") === "2",
  opening: null,
  rescanning: null,
  last: "—",
};

const hosts = () => (state.twoHosts ? HOSTS : HOSTS.slice(0, 1));
const hostById = (id) => HOSTS.find((h) => h.id === id);
const find = (h, p) => hostById(h).services.find((s) => s.port === Number(p));
const titleOf = (s) => s.title ?? `Port ${s.port}`;
const wsLabel = (ws) => (ws.name === ws.project ? ws.project : `${ws.project} · ${ws.name}`);
const split = (services) => ({
  pages: services.filter((s) => s.ws).sort((a, b) => a.port - b.port),
  others: services.filter((s) => !s.ws).sort((a, b) => a.port - b.port),
});
const isOpening = (h, s) => state.opening === `${h.id}:${s.port}`;
const ref = (h, s) => `data-h="${h.id}" data-p="${s.port}"`;

const favicon = (s) => s.fav ? `<span class="fav">${FAVICONS[s.fav]}</span>` : `<span class="fav none">${ic("globe")}</span>`;
// Workspace pages name their workspace; everything else names the process behind it.
const subLine = (s) => s.ws
  ? `<span class="sub ell">${esc(wsLabel(s.ws))}</span>`
  : `<span class="sub cmd ell">${esc(s.cmd)}</span>`;

function actions(h, s) {
  if (isOpening(h, s)) return `<div class="acts"><span class="ib"><span class="loader"></span></span></div>`;
  return `<div class="acts">
    ${s.local ? `<button class="ib" data-act="stop" ${ref(h, s)} title="Stop forwarding" aria-label="Stop forwarding ${esc(titleOf(s))}">${ic("unplug", "sm")}</button>` : ""}
    <button class="ib" data-act="ext" ${ref(h, s)} title="Open in system browser" aria-label="Open ${esc(titleOf(s))} in system browser">${ic("ext", "sm")}</button>
  </div>`;
}

function cardOpen(h, s, extra) {
  const on = Boolean(s.local);
  const cls = ["card", s.ws ? "" : "other", on ? "on" : "", isOpening(h, s) ? "busy" : "", extra].join(" ");
  const label = `Open ${titleOf(s)} in Paseo${on ? `, forwarded to localhost:${s.local}` : ""}`;
  return `<div class="${cls}" role="button" tabindex="0" aria-label="${esc(label)}" data-act="open" ${ref(h, s)}>`;
}

const head = (h, s) => `<div class="head">${favicon(s)}<div class="names"><b class="title ell">${esc(titleOf(s))}</b>${subLine(s)}</div></div>${actions(h, s)}`;

const rescanBtn = (h) =>
  `<button class="ib" data-act="rescan" data-h="${h.id}" title="Rescan ${h.name}" aria-label="Rescan ${h.name}">${ic("refresh", state.rescanning === h.id ? "spin" : "")}</button>`;

// One host is the common case: it is the screen's scope, beside the title, and gets no section of its own.
function titleRow() {
  const one = !state.twoHosts;
  const h = hosts()[0];
  return `<header class="title-row"><h1>Web services</h1>
      ${one ? `<span class="scope">${ic("server", "sm")}${h.name}</span>` : ""}
      <span class="tools">${one ? rescanBtn(h) : ""}<button class="ib" data-act="add" title="Add host" aria-label="Add host">${ic("plus")}</button></span>
    </header>`;
}

function cardScreen(card) {
  return titleRow() + hosts().map((h) => {
    const { pages, others } = split(h.services);
    const sections = `
      ${pages.length ? `<section><h2>Workspace pages <span class="n">${pages.length}</span></h2><div class="grid">${pages.map((s) => card(h, s)).join("")}</div></section>` : ""}
      ${others.length ? `<section><h2>Other services <span class="n">${others.length}</span></h2><div class="grid">${others.map((s) => card(h, s)).join("")}</div></section>` : ""}`;
    return state.twoHosts
      ? `<section><div class="host-h">${ic("server")}<span>${h.name}</span>${rescanBtn(h)}</div><div class="host-block">${sections}</div></section>`
      : sections;
  }).join("");
}

// ---------- 0: current ----------
function v0() {
  return `<div class="row-between"><h1>Web services</h1>
      <button class="v0-btn-lg" data-act="add">${ic("plus")}Add host</button></div>
    ${hosts().map((h) => {
      const { pages, others } = split(h.services);
      const rows = [...pages, ...others];
      return `<section>
        <div class="v0-host">
          <span class="v0-hicon">${ic("server")}</span><span class="v0-hname">${h.name}</span>
          <span class="muted" style="font-size:12px">Pages · ${rows.length}</span>
          <button class="v0-hact" data-act="rescan" data-h="${h.id}">${ic("refresh", state.rescanning === h.id ? "spin" : "")}Rescan</button>
        </div>
        <div class="v0-table">
          <div class="v0-grid v0-head"><span>Service</span><span>Remote port</span><span>Local address</span><span>Workspace</span><span>Status</span><span style="text-align:right">Actions</span></div>
          ${rows.map((s) => `<div class="v0-grid v0-row" data-act="open" ${ref(h, s)}>
            <span class="v0-svc"><span class="v0-av">${s.ws ? s.ws.project[0].toUpperCase() : s.title ? s.title[0].toUpperCase() : ic("globe")}</span>
              <b class="ell">${esc(titleOf(s))}</b>${isOpening(h, s) ? '<span class="loader"></span>' : `<span class="muted">${ic("arrow")}</span>`}</span>
            <span class="muted">${s.port}</span>
            <span class="muted">${s.local ? `localhost:${s.local}` : "—"}</span>
            <span class="muted ell">${s.ws ? esc(wsLabel(s.ws)) : "—"}</span>
            <span class="v0-st ${s.local ? "on" : ""}"><i></i>${s.local ? "Forwarded" : "Not forwarded"}</span>
            <span class="v0-acts">
              <button data-act="ext" ${ref(h, s)}>${ic("ext", "sm")}Browser</button>
              ${s.local ? `<button data-act="stop" ${ref(h, s)}>${ic("unplug", "sm")}Stop forwarding</button>` : ""}
            </span>
          </div>`).join("")}
        </div>
      </section>`;
    }).join("")}`;
}

// ---------- J: tunnel card ----------
// The card's foot is the tunnel itself: the host's port on the left, this computer's on the right.
const vJ = () => cardScreen((h, s) => `${cardOpen(h, s, "")}
    ${head(h, s)}
    <div class="tunnel" title="${s.local ? `${h.name}:${s.port} → localhost:${s.local}` : "Not forwarded yet"}">
      <span class="end">${h.name}:${s.port}</span>
      <span class="link"><span class="fill"></span></span>
      <span class="end local">${s.local ? `localhost:${s.local}` : ""}</span>
    </div>
  </div>`);

// ---------- K: port figures card ----------
// The two ports are the card's figures; the link between them turns green once the tunnel is up.
const vK = () => cardScreen((h, s) => `${cardOpen(h, s, "k")}
    ${head(h, s)}
    <div class="ports">
      <span class="num">${s.port}<span class="cap">${h.name}</span></span>
      <span class="link"><span class="fill"></span></span>
      <span class="num local ${s.local ? "on" : "off"}">${s.local ?? "—"}<span class="cap">localhost</span></span>
    </div>
  </div>`);

// ---------- shell ----------
function switcher() {
  const v = VARIANTS.find((x) => x.key === state.variant);
  const forwards = hosts().flatMap((h) => h.services.filter((s) => s.local).map((s) => `${h.name}:${s.port}→${s.local}`));
  return `<div class="sw">
    <button data-sw="-1" title="←">‹</button><span class="name">${v.key} · ${v.name}</span><button data-sw="1" title="→">›</button>
    <span class="sep"></span><label><input type="checkbox" id="two" ${state.twoHosts ? "checked" : ""}>2 hosts</label>
    <span class="sep"></span><span class="state" title="${esc(state.last)}">Forwards: ${forwards.join(", ") || "none"} · Last: ${esc(state.last)}</span>
  </div>`;
}

function render() {
  const body = { "0": v0, J: vJ, K: vK }[state.variant]();
  document.getElementById("app").innerHTML = `<main class="page">${body}</main>${switcher()}`;
}

function setVariant(step) {
  const index = VARIANTS.findIndex((v) => v.key === state.variant);
  state.variant = VARIANTS[(index + step + VARIANTS.length) % VARIANTS.length].key;
  syncUrl();
  render();
}

function syncUrl() {
  const p = new URLSearchParams({ variant: state.variant });
  if (state.twoHosts) p.set("hosts", "2");
  history.replaceState(null, "", `?${p}`);
}

function open(h, p, external) {
  if (state.opening) return;
  const s = find(h, p);
  const wasForwarded = Boolean(s.local);
  state.opening = `${h}:${p}`;
  s.local ??= s.port === 59227 ? 60000 : s.port;
  render();
  // An existing tunnel opens at once; a new one is dug first.
  setTimeout(() => {
    state.opening = null;
    state.last = external
      ? `system browser ← http://localhost:${s.local}`
      : `Paseo browser ← ${titleOf(s)}${s.ws ? ` (${wsLabel(s.ws)})` : ""}`;
    render();
  }, wasForwarded ? 150 : 800);
}

document.addEventListener("click", (event) => {
  const sw = event.target.closest("[data-sw]");
  if (sw) return setVariant(Number(sw.dataset.sw));
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const { act, h, p } = el.dataset;
  if (act === "open") open(h, p, event.metaKey || event.ctrlKey);
  if (act === "ext") open(h, p, true);
  if (act === "stop") { find(h, p).local = null; state.last = `stopped ${hostById(h).name}:${p}`; render(); }
  if (act === "add") { state.last = "Add host (not prototyped)"; render(); }
  if (act === "rescan") {
    state.rescanning = h;
    render();
    setTimeout(() => { state.rescanning = null; state.last = `rescanned ${hostById(h).name}`; render(); }, 700);
  }
});

document.addEventListener("change", (event) => {
  if (event.target.id === "two") { state.twoHosts = event.target.checked; syncUrl(); render(); }
});

document.addEventListener("keydown", (event) => {
  const card = event.target.closest?.(".card");
  if (card && event.target === card && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    open(card.dataset.h, card.dataset.p, event.metaKey || event.ctrlKey);
    return;
  }
  if (event.target.closest?.("input, textarea, [contenteditable]")) return;
  if (event.key === "ArrowLeft") setVariant(-1);
  if (event.key === "ArrowRight") setVariant(1);
});

render();
</script>
</body>
</html>
