<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页服务 · 视觉方案</title>
<style>
:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background:#151517; color:#f1f1f2; font-size:14px; }
* { box-sizing:border-box; } body { margin:0; } button { font:inherit; color:inherit; cursor:pointer; } button:focus-visible { outline:2px solid #a6b0bc; outline-offset:3px; } svg { display:block; flex:none; } .top { height:39px; border-bottom:1px solid #29292c; padding:0 24px; display:flex; align-items:center; color:#c9c9cd; font-size:13px; }
main { max-width:1280px; padding:32px 36px 110px; margin:auto; } .heading { display:flex; align-items:center; gap:14px; margin-bottom:32px; } h1 { font-size:24px; letter-spacing:-.025em; margin:0; } .host { background:#242427; border:0; border-radius:6px; padding:8px 10px; display:flex; align-items:center; gap:8px; color:#dedee0; } .tools { margin-left:auto; display:flex; align-items:center; gap:8px; } .tool { color:#a3a3a9; border:0; background:transparent; padding:8px; border-radius:6px; } .tool:hover,.more:hover { background:#303034; color:white; } .tool.add { color:#e3e3e5; background:#252528; padding:8px 12px; } .sections { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; align-items:start; } .group-heading { display:flex; align-items:center; gap:10px; min-width:0; } .group-heading svg { color:#a0a0a6; } .group-heading h2 { margin:0; font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; } .count { color:#919197; font-size:12px; margin-left:auto; font-variant-numeric:tabular-nums; } .dot { width:7px; height:7px; border-radius:50%; background:#70bf85; display:inline-block; flex:none; } .dot.off { background:#797981; } .status { color:#a5a5ab; display:flex; align-items:center; gap:7px; font-size:12px; white-space:nowrap; } .open { border:0; border-radius:6px; background:#303034; padding:8px 11px; display:flex; gap:8px; align-items:center; font-size:12px; white-space:nowrap; } .open:hover { background:#414147; } .more { border:0; color:#a0a0a6; background:none; padding:7px; border-radius:6px; } .service-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; } .port { color:#96969d; font-size:12px; font-variant-numeric:tabular-nums; } .service-icon { color:#94949b; }
/* A: compact workspaces */
.a .group { border:1px solid #303034; border-radius:10px; overflow:hidden; background:#1b1b1e; } .a .group-heading { padding:17px 18px; } .a .entries { padding:0 8px 8px; } .a .entry { display:grid; grid-template-columns:18px minmax(0,1fr) auto auto; gap:12px; align-items:center; min-height:94px; padding:10px; border-radius:6px; } .a .entry:hover { background:#252528; } .a .entry + .entry { border-top:1px solid #2b2b2e; } .a .identity { min-width:0; } .a .port { margin-top:5px; } .a .row-actions { display:flex; align-items:center; gap:2px; } .a .status { grid-column:2; margin-top:4px; } .a .entry { grid-template-rows:auto auto; row-gap:0; } .a .entry .service-icon,.a .entry .row-actions { grid-row:1 / 3; } .a .row-actions { grid-column:4; } .a .more { grid-column:3; grid-row:1 / 3; }
/* B: open directory */
.b .sections { grid-template-columns:1fr; gap:34px; } .b .group-heading { margin-bottom:13px; } .b .count { margin-left:0; } .b .entries { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .b .entry { background:#212124; border-radius:8px; min-height:144px; padding:17px; display:flex; flex-direction:column; } .b .entry:hover { background:#28282c; } .b .entry-head { display:flex; gap:10px; align-items:flex-start; min-width:0; } .b .identity { min-width:0; flex:1; } .b .port { margin-top:5px; } .b .more { margin:-6px -6px 0 0; } .b .entry-foot { display:flex; align-items:end; justify-content:space-between; gap:8px; margin-top:auto; } .b .open { background:#303034; }
/* C: tunnel ledger */
.c .sections { grid-template-columns:1fr; gap:25px; } .c .group { background:#1c1c1f; border-radius:9px; overflow:hidden; } .c .group-heading { padding:17px 20px; } .c .labels,.c .entry { display:grid; grid-template-columns:minmax(190px,2fr) minmax(180px,1.7fr) 100px 80px; gap:20px; align-items:center; padding:0 20px; } .c .labels { height:32px; color:#898990; font-size:12px; border-top:1px solid #303034; } .c .entry { min-height:65px; border-top:1px solid #2b2b2f; } .c .entry:hover { background:#252529; } .c .identity { display:flex; align-items:center; gap:11px; min-width:0; } .c .identity > div { min-width:0; } .c .route { display:flex; align-items:center; gap:9px; font-size:12px; color:#c4c4c8; font-variant-numeric:tabular-nums; white-space:nowrap; } .c .route .arrow { color:#73737a; } .c .route .local { color:#e0e0e2; } .c .entry-actions { display:flex; justify-content:flex-end; align-items:center; gap:3px; } .c .open { background:none; color:#e0e0e3; padding:8px 5px; } .c .open:hover { background:#303034; }
.switcher { position:fixed; z-index:5; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:4px; background:#e7e7e7; color:#202023; border-radius:9px; padding:5px; box-shadow:0 8px 30px #0007; white-space:nowrap; } .switcher span { font-size:12px; padding:0 8px; color:#66666b; } .switcher button { color:#45454a; background:transparent; border:0; border-radius:5px; padding:8px 12px; font-size:12px; } .switcher button[aria-pressed="true"] { background:#262629; color:#fff; } .toast { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); padding:9px 14px; border-radius:6px; background:#35353a; font-size:12px; display:none; }
@media (max-width:800px) { main { padding:24px 20px 110px; } .sections { grid-template-columns:1fr; } .b .entries { grid-template-columns:repeat(2,minmax(0,1fr)); } .c .labels,.c .entry { grid-template-columns:minmax(150px,1.5fr) minmax(150px,1fr) 80px; gap:10px; } .c .labels > :nth-child(3),.c .entry > .status { display:none; } }
@media (max-width:520px) { .top { padding-left:20px; } h1 { font-size:20px; } .heading { flex-wrap:wrap; gap:10px; margin-bottom:25px; } .tools .tool span { display:none; } .b .entries { grid-template-columns:1fr; } .b .entry { min-height:128px; } .c .labels { display:none; } .c .entry { grid-template-columns:minmax(0,1fr) auto; padding:14px 16px; gap:8px; } .c .route { grid-column:1; grid-row:2; padding-left:27px; } .c .entry-actions { grid-column:2; grid-row:1 / 3; } .switcher span { display:none; } .switcher button { padding:8px; } }
</style>
</head>
<body>
<div class="top">SSH 浏览器</div>
<main id="app"></main>
<div class="switcher" aria-label="切换设计方案"><span>视觉方案</span><button data-variant="a">A · 紧凑分组</button><button data-variant="b">B · 服务目录</button><button data-variant="c">C · 端口清单</button></div>
<div class="toast" role="status"></div>
<script>
const paths = { server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>', folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>', arrow:'<path d="M4 12h15M14 7l5 5-5 5"/>', down:'<path d="m7 10 5 5 5-5"/>', refresh:'<path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 12-3l3 3M19 15a7 7 0 0 1-12 3l-3-3"/>', plus:'<path d="M12 5v14M5 12h14"/>' };
const icon = (name,size=16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
const groups = [
 { title:'paseo-broswer · Redesign interface for improve...', rows:[
  {title:'SSH Browser 测试 A · localhost',port:18765,local:18765},
  {title:'SSH Browser 测试 B · IPv4',port:18766,local:18766},
  {title:'SSH Browser 测试 C · IPv6',port:18767,local:18767} ] },
 { title:'未归属工作区', rows:[
  {title:'Home - CUPS 2.4.16',port:631,local:10631},
  {title:'Hermes Agent - Dashboard',port:54831,local:54831},
  {title:'端口 59227',port:59227,local:null} ] }
];
const groupHeader = g => `<div class="group-heading">${icon('folder',18)}<h2 title="${g.title}">${g.title}</h2><span class="count">${g.rows.length}</span></div>`;
const identity = r => `<div class="identity"><div class="service-name" title="${r.title}">${r.title}</div><div class="port">端口 ${r.port}</div></div>`;
const status = r => `<div class="status"><span class="dot ${r.local ? '' : 'off'}"></span>${r.local ? `已转发到 localhost:${r.local}` : '未转发'}</div>`;
const open = r => `<button class="open" data-action="打开 ${r.title}">打开 ${icon('arrow',14)}</button>`;
const more = r => `<button class="more" aria-label="${r.title} 的更多操作" data-action="${r.title} 的更多操作">${icon('more',17)}</button>`;
function renderRow(r, variant) {
 if (variant === 'a') return `<div class="entry"><span class="service-icon">${icon('globe',18)}</span>${identity(r)}${more(r)}<div class="row-actions">${open(r)}</div>${status(r)}</div>`;
 if (variant === 'b') return `<div class="entry"><div class="entry-head"><span class="service-icon">${icon('globe',18)}</span>${identity(r)}${more(r)}</div><div class="entry-foot">${status(r)}${open(r)}</div></div>`;
 return `<div class="entry"><div class="identity"><span class="service-icon">${icon('globe',17)}</span><div><div class="service-name" title="${r.title}">${r.title}</div></div></div><div class="route"><span>${r.port}</span><span class="arrow">→</span><span class="local">${r.local ? `localhost:${r.local}` : '未转发'}</span></div><div class="status"><span class="dot ${r.local ? '' : 'off'}"></span>${r.local ? '已转发' : '未转发'}</div><div class="entry-actions">${open(r)}${more(r)}</div></div>`;
}
function render(variant) {
 document.querySelector('#app').className=variant;
 document.querySelector('#app').innerHTML=`<div class="heading"><h1>网页服务</h1><button class="host" data-action="选择主机">${icon('server',15)} mir-A5 ${icon('down',13)}</button><div class="tools"><button class="tool" data-action="重新扫描" aria-label="重新扫描">${icon('refresh',17)}</button><button class="tool add" data-action="添加主机">＋ <span>添加主机</span></button></div></div><div class="sections">${groups.map(g=>`<section class="group">${groupHeader(g)}${variant==='c'?'<div class="labels"><span>服务</span><span>远程端口 → 本地地址</span><span>状态</span><span></span></div>':''}<div class="entries">${g.rows.map(r=>renderRow(r,variant)).join('')}</div></section>`).join('')}</div>`;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
 const url=new URL(location.href); url.searchParams.set('variant',variant); history.replaceState(null,'',url);
}
const initial=new URLSearchParams(location.search).get('variant'); render(['a','b','c'].includes(initial)?initial:'a');
document.addEventListener('click',e=>{const toggle=e.target.closest('[data-variant]'); if(toggle) render(toggle.dataset.variant); const action=e.target.closest('[data-action]'); if(action){const toast=document.querySelector('.toast'); toast.textContent=`预览示意：${action.dataset.action}`; toast.style.display='block'; clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>toast.style.display='none',1800);}});
</script>
</body>
</html>
