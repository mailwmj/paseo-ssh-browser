<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页服务 · SSH 浏览器原型</title>
<style>
:root{color-scheme:dark;--bg:#161618;--surface:#202023;--hover:#28282c;--ink:#f2f2f3;--muted:#a1a1aa;--faint:#85858d;--green:#72c88b;--border:#35353a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d9d9df;outline-offset:3px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.window{height:35px;border-bottom:1px solid #29292c;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;color:#d8d8dc}.window-right{display:flex;align-items:center;gap:25px;color:#a0a0a8}.window-host{display:flex;align-items:center;gap:8px;background:#202023;border:1px solid #303034;border-radius:6px;padding:5px 11px;color:#e5e5e8}.dot{height:7px;width:7px;display:inline-block;border-radius:50%;background:var(--green);flex:none}.window-controls{letter-spacing:2px}
main{width:min(1260px,calc(100% - 64px));margin:0 auto;padding:35px 0 80px}.page-header{display:flex;align-items:center;justify-content:space-between;gap:20px}.title-wrap{display:flex;align-items:center;gap:13px;min-width:0}h1{font-size:23px;line-height:30px;margin:0;letter-spacing:-.02em}.host{display:flex;align-items:center;gap:7px;color:#bcbcc3;font-size:13px;padding:5px 10px;background:#222225;border-radius:6px}.host svg{width:14px;height:14px;color:#92929b}.host-select{position:relative}.host-select .host{padding-right:27px;cursor:pointer}.host-select select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.host-select:focus-within .host{outline:2px solid #d9d9df;outline-offset:3px}.host-select .chevron{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:12px;height:12px;pointer-events:none;color:#92929b}.tools{display:flex;align-items:center;gap:8px}.tool{height:34px;padding:0 11px;display:flex;align-items:center;gap:7px;border:0;border-radius:6px;background:transparent;color:#bcbcc3}.tool:hover{background:#29292d;color:white}.tool.add{background:#2b2b2f;color:#e5e5e7}.tool.add:hover{background:#37373c}
.section{margin-top:42px}.section+.section{margin-top:36px}.heading{display:flex;align-items:center;gap:9px;margin-bottom:13px;min-height:24px}.heading svg{color:#92929b}.heading h2{font-size:14px;font-weight:600;margin:0}.heading .project{color:#a8a8b0;font-weight:400}.heading .slash{color:#6d6d76;font-weight:400}.count{color:#83838c;font-size:12px;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,304px));gap:14px}.card{height:150px;position:relative;background:var(--surface);border-radius:10px;transition:background .15s;display:flex;flex-direction:column}.card:hover,.card:focus-within{background:var(--hover)}.card-main{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:left;border-radius:10px}.card-top{display:flex;gap:10px;align-items:flex-start;padding:17px 48px 0 16px;pointer-events:none}.service-icon{color:#9999a2;margin-top:1px}.card-top>div{min-width:0}.service-name{font-size:14px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.port{font-size:13px;color:#a3a3ac;margin-top:5px;font-variant-numeric:tabular-nums}.card-bottom{margin-top:auto;padding:0 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.state{display:flex;align-items:center;gap:7px;color:#9999a1;font-size:12px;min-width:0;white-space:nowrap}.state.on{color:#bfc9c0}.state .state-dot{width:6px;height:6px;border-radius:50%;background:#707078;flex:none}.state.on .state-dot{background:var(--green)}.open-label{font-size:12px;color:#d9d9dd;display:flex;align-items:center;gap:4px;white-space:nowrap}.open-label svg{width:13px;height:13px}.more{position:absolute;right:11px;top:11px;border:0;background:transparent;color:#aaaab2;border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}.more:hover,.more[aria-expanded=true]{background:#39393e;color:white}.menu{position:absolute;z-index:4;right:10px;top:43px;width:190px;background:#303035;border:1px solid #424248;border-radius:8px;padding:5px;box-shadow:0 8px 24px #0006}.menu[hidden]{display:none}.menu button{width:100%;border:0;background:transparent;border-radius:5px;text-align:left;padding:9px 10px;color:#e4e4e7;font-size:13px}.menu button:hover{background:#45454b}.empty{color:#aaaab2;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#35353a;color:#fff;padding:10px 15px;border-radius:7px;box-shadow:0 8px 25px #0006;font-size:13px;z-index:10}.toast[hidden]{display:none}dialog{background:#242427;color:var(--ink);border:1px solid #44444b;border-radius:10px;padding:22px;width:min(390px,calc(100% - 32px));box-shadow:0 18px 45px #0008}dialog::backdrop{background:#0009}dialog h2{font-size:16px;margin:0 0 20px}dialog label{font-size:13px;color:#c6c6cc;display:block;margin-bottom:7px}dialog input{width:100%;height:38px;background:#171719;border:1px solid #49494f;border-radius:6px;color:white;padding:0 10px}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}dialog .dialog-actions button{border:0;border-radius:6px;background:#39393f;padding:8px 14px}dialog .dialog-actions .primary{background:#ededee;color:#171719}
@media(max-width:700px){main{width:calc(100% - 32px);padding-top:26px}.page-header{align-items:flex-start;flex-direction:column;gap:15px}.tools{align-self:flex-end}.section{margin-top:32px}.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.window-controls{display:none}.window-right{gap:8px}.window-host{padding:4px 8px}.heading{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="window"><span>SSH 浏览器</span><div class="window-right"><span class="window-host"><span class="dot"></span> mir-A5 <span>⌄</span></span><span class="window-controls">×　−　□　×</span></div></div>
<main>
<header class="page-header"><div class="title-wrap"><h1>网页服务</h1><span class="host-select"><span class="host"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg><span id="host-label">mir-A5</span></span><svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg><select id="host-select" aria-label="切换网页服务的主机"><option value="mir-A5">mir-A5</option><option value="bkk-dev">bkk-dev</option></select></span></div><div class="tools"><button class="tool" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9A7 7 0 0 1 18 6l2 1M4 17l2 1a7 7 0 0 0 12.3-3"/></svg>重新扫描</button><button class="tool add" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加主机</button></div></header>
<div id="groups"></div>
</main>
<div class="toast" role="status" hidden></div>
<dialog id="add-dialog"><form method="dialog"><h2>添加 SSH 主机</h2><label for="ssh">SSH 地址</label><input id="ssh" placeholder="例如 user@devbox" autocomplete="off"><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" value="add">添加</button></div></form></dialog>
<script>
const icons={folder:'<svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg>',more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'};
// Example workspace groups show the design; the three ungrouped services match the supplied screenshot.
const hosts={"mir-A5":[{project:'paseo-broswer',workspace:'main',services:[{title:'web',port:5173,local:5173}]},{project:'my-project',workspace:'preview-tunnel',services:[{title:'Storybook',port:6006,local:null},{title:'OpenCode',port:49374,local:null}]},{project:null,workspace:'未归属工作区',services:[{title:'Home - CUPS 2.4.16',port:631,local:null},{title:'Hermes Agent - Dashboard',port:54831,local:null},{title:'端口 59227',port:59227,local:null}]}],"bkk-dev":[{project:'shop-web',workspace:'main',services:[{title:'Next.js',port:3000,local:null},{title:'Storybook',port:6006,local:null}]},{project:null,workspace:'未归属工作区',services:[{title:'端口 8080',port:8080,local:null}]}]};
let groups=hosts['mir-A5'];
let timer;function message(s){const t=document.querySelector('.toast');t.textContent=s;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2800)}
function render(){document.querySelector('#groups').innerHTML=groups.map((g,gi)=>`<section class="section"><div class="heading">${g.project?icons.folder:''}<h2>${g.project?`<span class="project">${g.project}</span> <span class="slash">/</span> `:''}${g.workspace}</h2><span class="count">${g.services.length}</span></div><div class="cards">${g.services.map((s,si)=>`<article class="card"><button class="card-main" data-open="${gi},${si}" aria-label="打开 ${s.title}"></button><div class="card-top"><span class="service-icon">${icons.globe}</span><div><div class="service-name">${s.title}</div><div class="port">端口 ${s.port}</div></div></div><div class="card-bottom"><span class="state ${s.local?'on':''}"><span class="state-dot"></span>${s.local?`已转发 · localhost:${s.local}`:'未转发'}</span><span class="open-label">打开 ${icons.arrow}</span></div><button class="more" data-more="${gi},${si}" aria-label="${s.title} 的更多操作" aria-expanded="false">${icons.more}</button><div class="menu" hidden><button data-external="${gi},${si}">在系统浏览器中打开</button>${s.local?`<button data-stop="${gi},${si}">停止转发</button>`:''}</div></article>`).join('')}</div></section>`).join('')}
function service(key){const [a,b]=key.split(',').map(Number);return groups[a].services[b]}
document.addEventListener('click',e=>{const more=e.target.closest('[data-more]');if(more){const menu=more.nextElementSibling,wasHidden=menu.hidden;document.querySelectorAll('.menu').forEach(m=>m.hidden=true);document.querySelectorAll('.more').forEach(b=>b.setAttribute('aria-expanded','false'));menu.hidden=!wasHidden;more.setAttribute('aria-expanded',String(wasHidden));return}const open=e.target.closest('[data-open],[data-external]');if(open){const external=open.dataset.external!==undefined;const s=service(external?open.dataset.external:open.dataset.open);s.local=s.local??(s.port<1024?s.port+10000:s.port);render();message(`原型演示：已转发 ${s.title}，${external?'在系统浏览器打开':'打开页面'}`);return}const stop=e.target.closest('[data-stop]');if(stop){const s=service(stop.dataset.stop);s.local=null;render();message(`原型演示：已停止 ${s.title} 的转发`);return}document.querySelectorAll('.menu').forEach(m=>m.hidden=true);document.querySelectorAll('.more').forEach(b=>b.setAttribute('aria-expanded','false'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.menu').forEach(m=>m.hidden=true);document.querySelectorAll('.more').forEach(b=>b.setAttribute('aria-expanded','false'))}});
document.querySelector('#host-select').addEventListener('change',e=>{groups=hosts[e.target.value];document.querySelector('#host-label').textContent=e.target.value;render()});document.querySelector('#refresh').onclick=()=>message('原型演示：扫描完成');document.querySelector('#add').onclick=()=>document.querySelector('#add-dialog').showModal();document.querySelector('#add-dialog').addEventListener('close',e=>{if(e.target.returnValue==='add')message('原型演示：添加主机')});render();
</script>
</body>
</html>
